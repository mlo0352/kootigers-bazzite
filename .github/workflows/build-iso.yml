---
name: Build installer ISO

on:
  workflow_dispatch:

env:
  IMAGE_NAME: kootigers-bazzite
  IMAGE_REGISTRY: ghcr.io/mlo0352
  DEFAULT_TAG: latest
  BIB_IMAGE: quay.io/centos-bootc/bootc-image-builder:latest

concurrency:
  group: ${{ github.workflow }}-${{ github.ref || github.run_id }}
  cancel-in-progress: true

jobs:
  build_iso:
    name: Build amd64 Anaconda installer ISO
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: read
      id-token: write

    steps:
      - name: Prepare environment
        shell: bash
        run: |
          echo "USER_UID=$(id -u)" >> "$GITHUB_ENV"
          echo "USER_GID=$(id -g)" >> "$GITHUB_ENV"

      - name: Maximize build space
        uses: ublue-os/remove-unwanted-software@cc0becac701cf642c8f0a6613bbdaf5dc36b259e # v9
        with:
          remove-codeql: true

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Log in to GitHub Container Registry
        shell: bash
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          printf '%s' "$GHCR_TOKEN" | podman login ghcr.io --username "${{ github.actor }}" --password-stdin

      - name: Build Anaconda ISO
        id: build
        uses: osbuild/bootc-image-builder-action@cb4b3e9c112077ea96a191fad229d51d2a012885 # main
        with:
          builder-image: ${{ env.BIB_IMAGE }}
          config-file: ./disk_config/iso-kde.toml
          image: ${{ env.IMAGE_REGISTRY }}/${{ env.IMAGE_NAME }}:${{ env.DEFAULT_TAG }}
          chown: ${{ env.USER_UID }}:${{ env.USER_GID }}
          rootfs: btrfs
          types: anaconda-iso
          additional-args: --use-librepo=True

      - name: Verify ISO output and write checksums
        id: verify
        shell: bash
        env:
          OUTPUT_DIR: ${{ steps.build.outputs.output-directory }}
        run: |
          set -euo pipefail
          mapfile -t iso_files < <(find "$OUTPUT_DIR" -type f -name '*.iso' -print)
          if [[ ${#iso_files[@]} -ne 1 ]]; then
            printf 'Expected exactly one ISO, found %s\n' "${#iso_files[@]}" >&2
            find "$OUTPUT_DIR" -maxdepth 4 -type f -printf '%p %s bytes\n' >&2
            exit 1
          fi
          iso_path="${iso_files[0]}"
          iso_dir="$(dirname "$iso_path")"
          iso_name="$(basename "$iso_path")"
          sha256sum "$iso_path" | sed "s#  .*#  $iso_name#" > "$iso_dir/SHA256SUMS.txt"
          stat --printf='ISO: %n\nSize: %s bytes\n' "$iso_path"
          cat "$iso_dir/SHA256SUMS.txt"

      - name: Upload installer ISO artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: kootigers-bazzite-amd64-iso
          path: ${{ steps.build.outputs.output-directory }}
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
          overwrite: true
